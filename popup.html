<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GSC Indexing</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font: 13px Arial, sans-serif;
      color: #172033;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font: inherit;
    }

    input {
      border: 1px solid #b8c2d1;
      border-radius: 5px;
    }

    button {
      margin-top: 8px;
      border: 0;
      border-radius: 5px;
      background: #1769d2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #94a3b8;
      cursor: default;
    }

    #report {
      margin-top: 12px;
      min-height: 100px;
      max-height: 300px;
      overflow: auto;
      padding: 10px;
      border: 1px solid #d5dbe5;
      border-radius: 5px;
      background: #f7f9fc;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>GSC Indexing</h1>
  <input id="targetUrl" type="url" placeholder="https://example.com/page">
  <button id="startBtn">Start</button>
  <div id="report" role="status" aria-live="polite">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
