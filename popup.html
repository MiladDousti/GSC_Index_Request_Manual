<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSC Indexing</title>
  <style>
    body {
      box-sizing: border-box;
      width: 390px;
      margin: 0;
      padding: 16px;
      font: 13px/1.45 Arial, sans-serif;
      color: #202124;
    }
    h1 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 150px;
      padding: 9px;
      resize: vertical;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font: 12px/1.5 Arial, sans-serif;
    }
    button {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 0;
      border-radius: 4px;
      background: #1a73e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #counter { margin: 5px 0 0; color: #5f6368; }
    #report {
      min-height: 105px;
      max-height: 260px;
      overflow: auto;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #f8f9fa;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>GSC Indexing</h1>
  <label for="urls">URLs — one per line (maximum 14)</label>
  <textarea id="urls" placeholder="https://example.com/page-1&#10;https://example.com/page-2"></textarea>
  <div id="counter">0 / 14 URLs</div>
  <button id="start" type="button">Start</button>
  <div id="report" role="status" aria-live="polite">No run started.</div>
  <script src="popup.js"></script>
</body>
</html>
