<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      width: 340px;
      padding: 14px;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 6px;
    }
    button:hover { background-color: #1d4ed8; }
    button.secondary {
      background-color: #64748b;
    }
    button.secondary:hover { background-color: #475569; }
    #status-box {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      max-height: 220px;
      overflow-y: auto;
    }
    .ok { background-color: #dcfce7 !important; border-color: #86efac !important; color: #166534; }
    .err { background-color: #fee2e2 !important; border-color: #fca5a5 !important; color: #991b1b; }
  </style>
</head>
<body>
  <h3>GSC URL Input Tester</h3>

  <input type="text" id="targetUrl" placeholder="Enter target URL to test" value="https://research.agah.com/" />

  <button id="inspectBtn">1. Type URL & Press Enter</button>
  <button id="pingBtn" class="secondary">Check Ping</button>

  <div id="status-box">Status: Ready.</div>
  <script src="popup.js"></script>
</body>
</html>
